<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHA Coffee — Wedding & Special Moments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="navbar">
    <a class="brandmark" href="#top">
      <span class="logo-medal" id="logoMedal">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M13 17h13v6a6.5 6.5 0 0 1-6.5 6.5h0A6.5 6.5 0 0 1 13 23v-6Z" stroke="#2E1B10" stroke-width="1.4"/>
          <path d="M26 18.5h1.6a2.4 2.4 0 0 1 0 4.8H26" stroke="#2E1B10" stroke-width="1.4"/>
        </svg>
      </span>
      <span>AHA Coffee<small>WEDDING &amp; SPECIAL MOMENTS</small></span>
    </a>
    <nav>
      <ul>
        <li><a href="#about">Tentang</a></li>
        <li><a href="#packages">Paket</a></li>
        <li><a href="#menu">Menu</a></li>
        <li><a href="#visit">Toko</a></li>
        <li><a href="#gallery">Galeri</a></li>
        <li><a href="#testimonials">Testimoni</a></li>
        <li><a href="#faq">FAQ</a></li>
      </ul>
    </nav>
    <a class="btn btn-primary" href="#booking">Konsultasi &amp; Booking</a>
    <button class="menu-toggle" aria-label="Buka menu"><span></span><span></span><span></span></button>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="wrap">
      <div>
        <p class="eyebrow-note" id="heroEyebrow"></p>
        <h1 id="heroTitle"></h1>
        <p class="lede" id="heroLede"></p>
        <div class="hero-actions">
          <a class="btn btn-primary" href="#packages">Lihat Wedding Package</a>
          <a class="btn btn-outline" href="#booking">Konsultasi &amp; Booking</a>
        </div>
        <div class="hero-stats" id="heroStats"></div>
      </div>
      <div class="hero-frame">
        <div class="hero-art">
          <img id="heroImage" src="" alt="AHA Coffee">
          <div class="ring"></div>
        </div>
        <div class="hero-plaque"><strong id="heroTagTitle"></strong><span id="heroTagSubtitle"></span></div>
      </div>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap">
      <div class="section-head">
        <p class="kicker" id="aboutKicker"></p>
        <h2 id="aboutTitle"></h2>
        <p id="aboutDesc"></p>
      </div>
      <div class="value-grid" id="valueGrid"></div>
    </div>
  </section>

  <section class="packages" id="packages">
    <div class="wrap">
      <div class="section-head center">
        <p class="kicker" id="packagesKicker"></p>
        <h2 id="packagesTitle"></h2>
        <p id="packagesDesc"></p>
      </div>
      <div class="package-grid" id="packageGrid"></div>
    </div>
  </section>

  <section class="menu" id="menu">
    <div class="wrap">
      <div class="section-head">
        <p class="kicker" id="menuKicker"></p>
        <h2 id="menuTitle"></h2>
      </div>
      <div class="menu-layout">
        <div class="menu-photo"><img id="menuImage" src="" alt="Menu AHA Coffee"></div>
        <div class="menu-cols">
          <div class="menu-col">
            <h3>Coffee</h3>
            <div id="menuCoffee"></div>
          </div>
          <div class="menu-col">
            <h3>Non-Coffee</h3>
            <div id="menuNonCoffee"></div>
          </div>
        </div>
      </div>
      <p class="menu-note" id="menuNote"></p>
      <div class="menu-contact">
        <p id="menuContactNote"></p>
        <div class="menu-contact-links" id="menuContactLinks"></div>
      </div>
    </div>
  </section>

  <section class="visit-shop" id="visit">
    <div class="wrap">
      <div class="visit-photo"><img id="visitImage" src="" alt="Suasana toko AHA Coffee"></div>
      <div>
        <p class="kicker" id="visitKicker" style="font-family:'Fraunces',serif; font-style:italic; color:var(--copper); margin-bottom:10px;"></p>
        <h2 id="visitTitle"></h2>
        <p id="visitDesc" style="margin-top:16px; color:var(--ink-soft);"></p>
        <div class="visit-details">
          <div class="row"><strong>Alamat</strong><span id="visitAddress"></span></div>
          <div class="row"><strong>Jam Buka</strong><span id="visitHours"></span></div>
        </div>
        <div class="visit-actions" id="visitActions"></div>
      </div>
    </div>
  </section>

  <section class="customize">
    <div class="wrap">
      <div class="customize-visual">
        <img id="customizeImage" src="" alt="Customize AHA Coffee">
      </div>
      <div>
        <p class="kicker" id="customizeKicker"></p>
        <h2 id="customizeTitle"></h2>
        <p id="customizeDesc"></p>
        <ul class="custom-list" id="customizeList"></ul>
      </div>
    </div>
  </section>

  <section class="gallery" id="gallery">
    <div class="wrap">
      <div class="section-head">
        <p class="kicker" id="galleryKicker"></p>
        <h2 id="galleryTitle"></h2>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  </section>

  <section class="testimonials" id="testimonials">
    <div class="wrap">
      <div class="section-head center">
        <p class="kicker" id="testiKicker"></p>
        <h2 id="testiTitle"></h2>
        <p id="testiDesc"></p>
      </div>
      <div class="testi-grid" id="testiGrid"></div>
    </div>
  </section>

  <section class="steps">
    <div class="wrap">
      <div class="section-head center">
        <p class="kicker" id="stepsKicker"></p>
        <h2 id="stepsTitle"></h2>
      </div>
      <div class="step-row" id="stepRow"></div>
    </div>
  </section>

  <section class="faq" id="faq">
    <div class="wrap">
      <div class="section-head center">
        <p class="kicker" id="faqKicker"></p>
        <h2 id="faqTitle"></h2>
      </div>
      <div class="faq-list" id="faqList"></div>
    </div>
  </section>

  <section class="booking" id="booking">
    <div class="wrap">
      <div>
        <p class="kicker" id="bookingKicker"></p>
        <h2 id="bookingTitle"></h2>
        <p class="lede" id="bookingLede"></p>
        <ul class="booking-contact" id="bookingContact"></ul>
      </div>
      <div class="receipt">
        <form onsubmit="event.preventDefault(); alert('Terima kasih! Tim AHA Coffee akan segera menghubungi Anda.');">
          <div class="form-row">
            <div>
              <label for="wdate">Wedding Date</label>
              <input id="wdate" type="date" required>
            </div>
            <div>
              <label for="venue">Venue</label>
              <input id="venue" type="text" placeholder="Nama venue / kota" required>
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="guests">Estimated Guests</label>
              <input id="guests" type="number" placeholder="Contoh: 150" required>
            </div>
            <div>
              <label for="package">Preferred Package</label>
              <select id="package" required>
                <option value="">Pilih paket</option>
                <option>Intimate (50 Cups)</option>
                <option>Sweet (100 Cups)</option>
                <option>Signature (150 Cups)</option>
                <option>Grand (200+ Cups)</option>
                <option>Belum yakin</option>
              </select>
            </div>
          </div>
          <div>
            <label for="contact">Contact / WhatsApp</label>
            <input id="contact" type="text" placeholder="08xx-xxxx-xxxx" required>
          </div>
          <button class="btn btn-gold" type="submit">Get Your Quotation</button>
        </form>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <div class="footer-top">
      <div>
        <a class="brandmark" href="#top">
          <span class="logo-medal" id="logoMedalFooter">
            <svg viewBox="0 0 40 40" fill="none">
              <path d="M13 17h13v6a6.5 6.5 0 0 1-6.5 6.5h0A6.5 6.5 0 0 1 13 23v-6Z" stroke="#2E1B10" stroke-width="1.4"/>
            </svg>
          </span>
          <span>AHA Coffee</span>
        </a>
        <p id="footerTagline"></p>
      </div>
      <div>
        <h5>Layanan Acara</h5>
        <ul id="footerServices"></ul>
      </div>
      <div>
        <h5>Kontak</h5>
        <ul id="footerContact"></ul>
      </div>
    </div>
    <div class="footer-bottom">
      <span id="footerNote"></span>
      <span id="footerSubNote"></span>
    </div>
  </div>
</footer>

<script src="content.js"></script>
<script>
(function(){
  const c = window.getAhaContent();

  function text(id, val){ const el = document.getElementById(id); if(el) el.textContent = val; }
  function img(id, src, alt){ const el = document.getElementById(id); if(el){ el.src = src; if(alt) el.alt = alt; } }

  // logo (kalau belum ada logo.jpeg / belum diupload di admin, tampilkan ikon cangkir default)
  if (c.logo) {
    const testImg = new Image();
    testImg.onload = function(){
      document.querySelectorAll('.logo-medal').forEach(m=>{ m.innerHTML = '<img src="'+c.logo+'" alt="Logo AHA Coffee">'; });
    };
    testImg.onerror = function(){ /* tetap pakai ikon default kalau file logo belum ada */ };
    testImg.src = c.logo;
  }

  // hero
  text('heroEyebrow', c.hero.eyebrow);
  text('heroTitle', c.hero.title);
  text('heroLede', c.hero.lede);
  img('heroImage', c.hero.image, 'AHA Coffee');
  text('heroTagTitle', c.hero.tagTitle);
  text('heroTagSubtitle', c.hero.tagSubtitle);
  document.getElementById('heroStats').innerHTML = c.hero.stats.map(s =>
    `<div><strong>${s.value}</strong><span>${s.label}</span></div>`
  ).join('');

  // about
  text('aboutKicker', c.about.kicker);
  text('aboutTitle', c.about.title);
  text('aboutDesc', c.about.desc);
  const marks = [
    '<path d="M10 15h20v9a10 10 0 0 1-10 10 10 10 0 0 1-10-10v-9Z" stroke="#2E1B10" stroke-width="1.3"/><path d="M30 17h3a4 4 0 0 1 0 8h-3" stroke="#2E1B10" stroke-width="1.3"/>',
    '<path d="M20 8l3 7 7 1-5.5 5 1.5 8-6-4-6 4 1.5-8L10 16l7-1 3-7Z" stroke="#A2602E" stroke-width="1.3"/>',
    '<circle cx="20" cy="14" r="5" stroke="#2E1B10" stroke-width="1.3"/><path d="M9 32c1-7 5-11 11-11s10 4 11 11" stroke="#2E1B10" stroke-width="1.3"/>',
    '<path d="M20 32s-11-7-11-15a6 6 0 0 1 11-3 6 6 0 0 1 11 3c0 8-11 15-11 15Z" stroke="#A2602E" stroke-width="1.3"/>',
    '<path d="M20 10v20M12 16l16 8M28 16l-16 8" stroke="#2E1B10" stroke-width="1.3"/>'
  ];
  document.getElementById('valueGrid').innerHTML = c.about.values.map((v,i) =>
    `<div class="value-item">
      <svg class="mark" viewBox="0 0 40 40" fill="none">${marks[i % marks.length]}</svg>
      <h3>${v.title}</h3>
      <p>${v.desc}</p>
    </div>`
  ).join('');

  // packages
  text('packagesKicker', c.packagesIntro.kicker);
  text('packagesTitle', c.packagesIntro.title);
  text('packagesDesc', c.packagesIntro.desc);
  document.getElementById('packageGrid').innerHTML = c.packages.map(p =>
    `<div class="package-card">
      <h3>${p.name}</h3>
      <p class="cups">${p.cups}</p>
      <p class="desc">${p.desc}</p>
      <ul class="includes">${p.includes.map(i => `<li>${i}</li>`).join('')}</ul>
      <a class="btn btn-outline" href="#booking">${p.cta}</a>
    </div>`
  ).join('');

  // menu
  text('menuKicker', c.menu.kicker);
  text('menuTitle', c.menu.title);
  text('menuNote', c.menu.note);
  document.getElementById('menuCoffee').innerHTML = c.menu.coffee.map(m =>
    `<div class="menu-line"><span class="name">${m.name}</span><span class="tag">${m.tag}</span></div>`
  ).join('');
  document.getElementById('menuNonCoffee').innerHTML = c.menu.nonCoffee.map(m =>
    `<div class="menu-line"><span class="name">${m.name}</span><span class="tag">${m.tag}</span></div>`
  ).join('');

  // customize
  text('customizeKicker', c.customize.kicker);
  text('customizeTitle', c.customize.title);
  text('customizeDesc', c.customize.desc);
  img('customizeImage', c.customize.image, 'Customize AHA Coffee');
  document.getElementById('customizeList').innerHTML = c.customize.items.map((item,i) =>
    `<li><span class="n">${String(i+1).padStart(2,'0')}</span> ${item}</li>`
  ).join('');

  // gallery
  text('galleryKicker', c.galleryIntro.kicker);
  text('galleryTitle', c.galleryIntro.title);
  const galleryClasses = ['g1','','g4','','g6',''];
  document.getElementById('galleryGrid').innerHTML = c.gallery.map((g,i) =>
    `<div class="g ${galleryClasses[i] || ''}"><img src="${g.image}" alt="${g.alt || ''}"></div>`
  ).join('');

  // testimonials
  text('testiKicker', c.testimonialsIntro.kicker);
  text('testiTitle', c.testimonialsIntro.title);
  text('testiDesc', c.testimonialsIntro.desc);
  document.getElementById('testiGrid').innerHTML = c.testimonials.map(t =>
    `<div class="testi-card"><div class="frame"><img src="${t.image}" alt="${t.alt || ''}"></div></div>`
  ).join('');

  // steps
  text('stepsKicker', c.stepsIntro.kicker);
  text('stepsTitle', c.stepsIntro.title);
  document.getElementById('stepRow').innerHTML = c.steps.map((s,i) =>
    `<div class="step"><span class="num">${String(i+1).padStart(2,'0')}</span><h4>${s.title}</h4><p>${s.desc}</p></div>`
  ).join('');

  // faq
  text('faqKicker', c.faqIntro.kicker);
  text('faqTitle', c.faqIntro.title);
  document.getElementById('faqList').innerHTML = c.faq.map(f =>
    `<div class="faq-item">
      <button class="faq-q"><span>${f.q}</span><span class="icon"></span></button>
      <div class="faq-a"><p>${f.a}</p></div>
    </div>`
  ).join('');
  document.querySelectorAll('.faq-item').forEach(item=>{
    const q = item.querySelector('.faq-q');
    const a = item.querySelector('.faq-a');
    q.addEventListener('click', ()=>{
      const isOpen = item.classList.contains('open');
      document.querySelectorAll('.faq-item.open').forEach(o=>{
        if(o!==item){ o.classList.remove('open'); o.querySelector('.faq-a').style.maxHeight = null; }
      });
      if(isOpen){ item.classList.remove('open'); a.style.maxHeight = null; }
      else { item.classList.add('open'); a.style.maxHeight = a.scrollHeight + 'px'; }
    });
  });

  // booking
  text('bookingKicker', c.booking.kicker);
  text('bookingTitle', c.booking.title);
  text('bookingLede', c.booking.lede);
  document.getElementById('bookingContact').innerHTML =
    `<li>WhatsApp <span><a href="${c.booking.whatsappLink}" target="_blank" style="color:inherit">${c.booking.whatsapp}</a></span></li>
     <li>Instagram <span><a href="${c.booking.instagramUrl}" target="_blank" style="color:inherit">${c.booking.instagramHandle}</a></span></li>
     <li>Shopee <span><a href="${c.booking.shopeeUrl}" target="_blank" style="color:inherit">Kunjungi Toko</a></span></li>
     <li>Email <span>${c.booking.email}</span></li>
     <li>Area layanan <span>${c.booking.area}</span></li>`;

  // menu contact chips
  document.getElementById('menuContactNote').textContent = c.menu.contactNote || '';
  document.getElementById('menuContactLinks').innerHTML =
    `<a class="chip-link" href="${c.booking.whatsappLink}" target="_blank">WhatsApp</a>
     <a class="chip-link" href="${c.booking.instagramUrl}" target="_blank">${c.booking.instagramHandle}</a>`;
  img('menuImage', c.menu.image, 'Menu AHA Coffee');

  // visit shop
  text('visitKicker', c.visitShop.kicker);
  text('visitTitle', c.visitShop.title);
  text('visitDesc', c.visitShop.desc);
  img('visitImage', c.visitShop.image, 'Suasana toko AHA Coffee');
  text('visitAddress', c.visitShop.address);
  text('visitHours', c.visitShop.hours);
  let visitActionsHtml = '';
  if (c.visitShop.mapUrl) {
    visitActionsHtml += `<a class="btn btn-primary" href="${c.visitShop.mapUrl}" target="_blank">${c.visitShop.ctaMap || 'Lihat Lokasi di Maps'}</a>`;
  }
  visitActionsHtml += `<a class="btn btn-outline" href="${c.booking.shopeeUrl}" target="_blank">Belanja di Shopee</a>`;
  visitActionsHtml += `<a class="btn btn-outline" href="${c.booking.whatsappLink}" target="_blank">Chat WhatsApp</a>`;
  document.getElementById('visitActions').innerHTML = visitActionsHtml;

  // footer
  text('footerTagline', c.footer.tagline);
  document.getElementById('footerServices').innerHTML = c.footer.services.map(s => `<li>${s}</li>`).join('');
  document.getElementById('footerContact').innerHTML =
    `<li>WhatsApp ${c.booking.whatsapp}</li>
     <li>Instagram ${c.booking.instagramHandle}</li>
     <li>Shopee: <a href="${c.booking.shopeeUrl}" target="_blank" style="color:inherit">Kunjungi Toko</a></li>
     <li>${c.booking.email}</li><li>${c.booking.area}</li>`;
  text('footerNote', c.footer.note);
  text('footerSubNote', c.footer.subNote);

})();
</script>

</body>
</html>
